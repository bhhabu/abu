<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>李峋爱心｜点燃我温暖你</title>
<style>
*{margin:0;padding:0}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
}
canvas{display:block;margin:0 auto;}
</style>
</head>
<body>
<canvas id="heartCanvas"></canvas>
<script>
const canvas = document.getElementById("heartCanvas");
const ctx = canvas.getContext("2d");
function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

class Point{
  constructor(x,y){
    this.x = x;
    this.y = y;
  }
  clone(){
    return new Point(this.x,this.y);
  }
  length(){
    return Math.sqrt(this.x*this.x + this.y*this.y);
  }
}

// 爱心参数方程
function pointOnHeart(t){
  return new Point(
    160 * Math.pow(Math.sin(t),3),
    -(130 * Math.cos(t) - 50 * Math.cos(2*t) - 20 * Math.cos(3*t) - 10 * Math.cos(4*t))
  );
}

let particles = [];
const settings = {
  particles:{
    size:170,
    density:5,
  }
};

function createParticles(){
  particles = [];
  for(let t=0;t<2*Math.PI;t += 0.01){
    const p = pointOnHeart(t);
    p.x = canvas.width/2 + p.x * settings.particles.size / 350;
    p.y = canvas.height/2 + p.y * settings.particles.size / 350;
    for(let i=0;i<settings.particles.density;i++){
      particles.push({
        x:p.x,
        y:p.y,
        vx:(Math.random()-0.5)*0.6,
        vy:(Math.random()-0.5)*0.6,
        life:Math.random()*1,
        decay:0.008
      })
    }
  }
}
createParticles();

let time = 0;
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  time += 0.01;
  const beat = 1 + 0.08*Math.sin(time*4); // 心跳缩放，核心！就是这个脉动效果
  for(let i=0;i<particles.length;i++){
    let p = particles[i];
    p.life -= p.decay;
    if(p.life <= 0){
      const t = Math.random()*2*Math.PI;
      const hp = pointOnHeart(t);
      p.x = canvas.width/2 + hp.x * settings.particles.size /350 * beat;
      p.y = canvas.height/2 + hp.y * settings.particles.size /350 * beat;
      p.life = 1;
    }
    p.x += p.vx;
    p.y += p.vy;
    ctx.beginPath();
    ctx.arc(p.x,p.y,1.2,0,2*Math.PI);
    ctx.fillStyle = `rgba(255, 100, 160, ${p.life})`;
    ctx.fill();
  }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
